name: Neki-iOS 배포 및 버전 관리

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 실행할 작업
        required: true
        type: choice
        options:
          - 개발기 연결 검증
          - 상용기 연결 검증
          - 개발기 TestFlight 업로드
          - 개발기 TestFlight + 권장 업데이트
          - 개발기 TestFlight + 강제 업데이트
          - 상용기 TestFlight 업로드
          - 상용기 App Store 심사 제출
          - 상용기 권장 업데이트 활성화
          - 상용기 강제 업데이트 활성화
      app_version:
        description: 대상 앱 버전(MAJOR.MINOR.PATCH)
        required: true
        type: string
      release_notes:
        description: TestFlight 및 App Store 선택 입력인 변경사항
        required: false
        type: string
      production_release_confirmed:
        description: 상용 버전의 App Store 공개 확인
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ios-delivery
  cancel-in-progress: false

jobs:
  delivery:
    runs-on: ${{ contains(inputs.operation, '업데이트 활성화') && 'ubuntu-latest' || 'macos-latest' }}
    timeout-minutes: 90
    environment:
      name: ${{ startsWith(inputs.operation, '개발기') && 'development' || 'production' }}

    steps:
      # 하나의 작업명으로 배포 환경, 목적지와 업데이트 정책을 결정합니다.
      - name: Resolve delivery operation
        env:
          OPERATION: ${{ inputs.operation }}
          APP_VERSION: ${{ inputs.app_version }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
          PRODUCTION_RELEASE_CONFIRMED: ${{ inputs.production_release_confirmed }}
          BUILD_XCCONFIG: ${{ secrets.BUILD_XCCONFIG }}
          FIREBASE_PLIST: ${{ secrets.FIREBASE_PLIST }}
          APP_VERSION_API_ADDRESS: ${{ secrets.APP_VERSION_API_ADDRESS }}
          MATCH_GITHUB_CLIENT_ID: ${{ secrets.MATCH_GITHUB_CLIENT_ID }}
          MATCH_GITHUB_APP_PRIVATE_KEY: ${{ secrets.MATCH_GITHUB_APP_PRIVATE_KEY }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
        run: |
          case "$OPERATION" in
            "개발기 연결 검증")
              DELIVERY_MODE="validate"
              DEPLOYMENT_TARGET="development"
              DISTRIBUTION_DESTINATION="testflight"
              UPDATE_POLICY="none"
              ;;
            "상용기 연결 검증")
              DELIVERY_MODE="validate"
              DEPLOYMENT_TARGET="production"
              DISTRIBUTION_DESTINATION="testflight"
              UPDATE_POLICY="none"
              ;;
            "개발기 TestFlight 업로드")
              DELIVERY_MODE="deploy"
              DEPLOYMENT_TARGET="development"
              DISTRIBUTION_DESTINATION="testflight"
              UPDATE_POLICY="none"
              ;;
            "개발기 TestFlight + 권장 업데이트")
              DELIVERY_MODE="deploy"
              DEPLOYMENT_TARGET="development"
              DISTRIBUTION_DESTINATION="testflight"
              UPDATE_POLICY="recommended"
              ;;
            "개발기 TestFlight + 강제 업데이트")
              DELIVERY_MODE="deploy"
              DEPLOYMENT_TARGET="development"
              DISTRIBUTION_DESTINATION="testflight"
              UPDATE_POLICY="required"
              ;;
            "상용기 TestFlight 업로드")
              DELIVERY_MODE="deploy"
              DEPLOYMENT_TARGET="production"
              DISTRIBUTION_DESTINATION="testflight"
              UPDATE_POLICY="none"
              ;;
            "상용기 App Store 심사 제출")
              DELIVERY_MODE="deploy"
              DEPLOYMENT_TARGET="production"
              DISTRIBUTION_DESTINATION="app_store_review"
              UPDATE_POLICY="none"
              ;;
            "상용기 권장 업데이트 활성화")
              DELIVERY_MODE="activate"
              DEPLOYMENT_TARGET="production"
              DISTRIBUTION_DESTINATION="none"
              UPDATE_POLICY="recommended"
              ;;
            "상용기 강제 업데이트 활성화")
              DELIVERY_MODE="activate"
              DEPLOYMENT_TARGET="production"
              DISTRIBUTION_DESTINATION="none"
              UPDATE_POLICY="required"
              ;;
            *)
              echo "::error::Unsupported delivery operation: $OPERATION"
              exit 1
              ;;
          esac

          if [[ ! "$APP_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::app_version must follow MAJOR.MINOR.PATCH"
            exit 1
          fi

          if [[ "$DELIVERY_MODE" == "activate" &&
                "$PRODUCTION_RELEASE_CONFIRMED" != "true" ]]; then
            echo "::error::Confirm that the production version is available on the App Store"
            exit 1
          fi

          required_names=()
          if [ "$DELIVERY_MODE" != "activate" ]; then
            required_names+=(
              BUILD_XCCONFIG
              FIREBASE_PLIST
              MATCH_GITHUB_CLIENT_ID
              MATCH_GITHUB_APP_PRIVATE_KEY
              ASC_KEY_ID
              ASC_ISSUER_ID
              ASC_KEY_CONTENT
              MATCH_PASSWORD
            )
          fi
          if [ "$UPDATE_POLICY" != "none" ]; then
            required_names+=(APP_VERSION_API_ADDRESS)
          fi

          for name in "${required_names[@]}"; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required GitHub Actions setting: $name"
              exit 1
            fi
          done

          case "$DEPLOYMENT_TARGET" in
            "development")
              TARGET_APP_NAME="Neki-dev"
              ;;
            "production")
              TARGET_APP_NAME="Neki-iOS"
              ;;
            "both")
              TARGET_APP_NAME="Neki-iOS & Dev"
              ;;
            *)
              echo "::error::Unsupported deployment target: $DEPLOYMENT_TARGET"
              exit 1
              ;;
          esac

          if [ "$DEPLOYMENT_TARGET" = "development" ]; then
            BUILD_SCHEME="Neki-iOS.Dev"
            XCCONFIG_PATH="Neki-iOS/APP/Sources/Resources/Debug.xcconfig"
            FIREBASE_PATH="Neki-iOS/APP/Sources/Resources/FirebaseConfig/Debug/GoogleService-Info.plist"
          else
            BUILD_SCHEME="Neki-iOS"
            XCCONFIG_PATH="Neki-iOS/APP/Sources/Resources/Release.xcconfig"
            FIREBASE_PATH="Neki-iOS/APP/Sources/Resources/FirebaseConfig/Release/GoogleService-Info.plist"
          fi

          {
            echo "DELIVERY_MODE=$DELIVERY_MODE"
            echo "DEPLOYMENT_TARGET=$DEPLOYMENT_TARGET"
            echo "DISTRIBUTION_DESTINATION=$DISTRIBUTION_DESTINATION"
            echo "UPDATE_POLICY=$UPDATE_POLICY"
            echo "BUILD_SCHEME=$BUILD_SCHEME"
            echo "XCCONFIG_PATH=$XCCONFIG_PATH"
            echo "FIREBASE_PATH=$FIREBASE_PATH"
            echo "TARGET_APP_NAME=$TARGET_APP_NAME"
          } >> "$GITHUB_ENV"

      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      # 아래 준비 단계는 연결 검증과 실제 배포가 같은 환경을 사용하도록 공유합니다.
      - name: Select Xcode
        if: ${{ !contains(inputs.operation, '업데이트 활성화') }}
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: '26.2'

      - name: Restore environment resources
        if: ${{ !contains(inputs.operation, '업데이트 활성화') }}
        env:
          BUILD_XCCONFIG: ${{ secrets.BUILD_XCCONFIG }}
          FIREBASE_PLIST: ${{ secrets.FIREBASE_PLIST }}
        run: |
          mkdir -p "$(dirname "$XCCONFIG_PATH")"
          printf '%s' "$BUILD_XCCONFIG" | base64 --decode > "$XCCONFIG_PATH"
          test -s "$XCCONFIG_PATH"

          AMPLITUDE_API_KEY_VALUE="$(
            awk -F= '
              /^[[:space:]]*AMPLITUDE_API_KEY[[:space:]]*=/ {
                value = $0
                sub(/^[^=]*=[[:space:]]*/, "", value)
                sub(/^[[:space:]"]*/, "", value)
                sub(/[[:space:]"]*$/, "", value)
                print value
                exit
              }
            ' "$XCCONFIG_PATH"
          )"
          if [ -z "$AMPLITUDE_API_KEY_VALUE" ] || [[ "$AMPLITUDE_API_KEY_VALUE" == *'$('* ]]; then
            echo "::error::AMPLITUDE_API_KEY is missing or unresolved in $XCCONFIG_PATH"
            exit 1
          fi

          mkdir -p "$(dirname "$FIREBASE_PATH")"
          printf '%s' "$FIREBASE_PLIST" | base64 --decode > "$FIREBASE_PATH"
          plutil -lint "$FIREBASE_PATH"

      - name: Disable Macro Validation
        if: ${{ !contains(inputs.operation, '업데이트 활성화') }}
        run: |
          defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES
          defaults write com.apple.dt.Xcode IDESkipPackagePluginFingerprintValidation -bool YES

      - name: Resolve SPM Dependencies
        if: ${{ !contains(inputs.operation, '업데이트 활성화') }}
        run: xcodebuild -resolvePackageDependencies -project ./Neki-iOS.xcodeproj -scheme "$BUILD_SCHEME"

      - name: Create GitHub App token for Match
        if: ${{ !contains(inputs.operation, '업데이트 활성화') }}
        id: match-app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ secrets.MATCH_GITHUB_CLIENT_ID }}
          private-key: ${{ secrets.MATCH_GITHUB_APP_PRIVATE_KEY }}
          owner: Team-Neki
          repositories: Neki-fastlane-match-repo
          permission-contents: read

      - name: Setup Ruby and Install Gems
        if: ${{ !contains(inputs.operation, '업데이트 활성화') }}
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: '3.3.12'
          bundler-cache: true

      - name: Validate or deploy app
        if: ${{ !contains(inputs.operation, '업데이트 활성화') }}
        id: app-delivery
        env:
          MARKETING_VERSION: ${{ inputs.app_version }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          MATCH_GITHUB_TOKEN: ${{ steps.match-app-token.outputs.token }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
        run: |
          if [ "$DELIVERY_MODE" = "validate" ]; then
            bundle exec fastlane ios validate_deployment
          else
            bundle exec fastlane ios deploy
          fi

      - name: Update and verify version policy
        if: ${{ contains(inputs.operation, '권장 업데이트') || contains(inputs.operation, '강제 업데이트') }}
        id: version-policy
        env:
          APP_VERSION_API_ADDRESS: ${{ secrets.APP_VERSION_API_ADDRESS }}
          APP_VERSION: ${{ inputs.app_version }}
        run: scripts/ci/update_app_version.sh

      - name: Send Discord notification
        if: always()
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          OPERATION: ${{ inputs.operation }}
          APP_VERSION: ${{ inputs.app_version }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
          JOB_STATUS: ${{ job.status }}
          TARGET_APP_NAME: ${{ env.TARGET_APP_NAME }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            TITLE="✅ 우리 Neki-iOS 정상영업 합니다."
            COLOR=5763719
          else
            TITLE="❌ 지금까지 Neki-iOS를 사랑해주셔서 감사합니다."
            COLOR=15548997
          fi

          TARGET_APP_NAME="${TARGET_APP_NAME:-확인 불가}"

          PAYLOAD=$(jq -n \
            --arg title "$TITLE" \
            --arg operation "$OPERATION" \
            --arg app "$TARGET_APP_NAME" \
            --arg version "$APP_VERSION" \
            --arg release_notes "$RELEASE_NOTES" \
            --argjson color "$COLOR" \
            '($release_notes | if length > 1024 then .[0:1023] + "…" else . end) as $display_notes |
            {
              embeds: [{
                title: $title,
                color: $color,
                fields: ([
                  {name: "작업 종류", value: $operation, inline: true},
                  {name: "대상 앱", value: $app, inline: true},
                  {name: "대상 버전", value: $version, inline: true}
                ] + (if $display_notes == "" then [] else [
                  {name: "릴리즈 노트", value: $display_notes, inline: false}
                ] end))
              }]
            }')
          curl --fail-with-body --silent --show-error \
            -H "Content-Type: application/json" \
            -X POST \
            -d "$PAYLOAD" \
            "$DISCORD_WEBHOOK_URL"
